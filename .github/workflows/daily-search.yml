# Scheduled discovery without keeping a server running.
#
# Requires a persistent database reachable from GitHub's runners, e.g. a free
# hosted Postgres (Neon, Supabase) via the DATABASE_URL secret.  SQLite inside
# the runner would be thrown away after every run.
name: daily-job-search

on:
  schedule:
    - cron: "30 2 * * *"      # 08:00 IST
  workflow_dispatch: {}

jobs:
  search:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check configuration
        id: check
        env:
          HAS_DB: ${{ secrets.DATABASE_URL != '' }}
          HAS_AI: ${{ secrets.GEMINI_API_KEY != '' || secrets.OPENROUTER_API_KEY != '' }}
        run: |
          echo "ok=$HAS_DB" >> "$GITHUB_OUTPUT"
          if [ "$HAS_DB" != "true" ]; then
            echo "::warning::DATABASE_URL secret is not set - skipping the scheduled search. Add it under Settings -> Secrets and variables -> Actions."
          fi
          if [ "$HAS_AI" != "true" ]; then
            echo "::warning::No GEMINI_API_KEY / OPENROUTER_API_KEY secret - jobs will be discovered and filtered but not scored."
          fi
      - uses: actions/checkout@v5
        if: steps.check.outputs.ok == 'true'
      - uses: actions/setup-python@v6
        if: steps.check.outputs.ok == 'true'
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt -r requirements-postgres.txt
        if: steps.check.outputs.ok == 'true'
      - name: Run discovery pipeline
        if: steps.check.outputs.ok == 'true'
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          OPENROUTER_MODEL: ${{ vars.OPENROUTER_MODEL }}
          ADZUNA_APP_ID: ${{ secrets.ADZUNA_APP_ID }}
          ADZUNA_APP_KEY: ${{ secrets.ADZUNA_APP_KEY }}
          NOTIFICATION_PROVIDERS: ${{ vars.NOTIFICATION_PROVIDERS || 'console' }}
          SMTP_HOST: ${{ secrets.SMTP_HOST }}
          SMTP_USERNAME: ${{ secrets.SMTP_USERNAME }}
          SMTP_PASSWORD: ${{ secrets.SMTP_PASSWORD }}
          SMTP_FROM: ${{ secrets.SMTP_FROM }}
          SMTP_TO: ${{ secrets.SMTP_TO }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          DASHBOARD_URL: ${{ vars.DASHBOARD_URL || 'http://localhost:8000' }}
          LOG_FORMAT: json
        run: python scripts/run_search.py
